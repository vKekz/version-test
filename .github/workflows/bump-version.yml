name: Bump version

on:
  workflow_dispatch:
    inputs:
      version_type:
        type: choice
        description: Gets the part of the version that should get bumped.
        options:
          - Major
          - Minor
          - Revision
        default: Revision
        required: true

permissions:
  contents: write

jobs:
  bump_version:
    name: Initiate version bump
    runs-on: ubuntu-latest

    steps:
#      - name: Fail if branch is not main
#        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
#        run: |
#          echo "This workflow should not be triggered with workflow_dispatch on a branch other than main"
#          exit 1

      - name: Checkout main branch
        uses: actions/checkout@v7.0.1

#      - name: Create new branch
#        run: |
#          git branch feat/version_bump

      - name: Bump "${{ inputs.version_type }}" version
        working-directory: scripts
        shell: pwsh
        run: ./bump-version.ps1 -${{ inputs.version_type }}

      - name: Commit & push
        run: |
          git remote set-url --push origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add .
          git commit -m "chore: bump versions"
          git push